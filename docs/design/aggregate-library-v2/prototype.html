</style></head><body><div class="shell"><aside class="intro"><div class="eyebrow">LUCENT · DESIGN PREVIEW</div><h1>连接一次。<br>按目录入库。</h1><p>存储负责连接，文件源定义入库范围。将 NAS、网盘与本地目录汇集成一个媒体库。</p><nav class="steps" aria-label="设计流程"><button onclick="go('library')"><span>01</span>聚合媒体库</button><button onclick="go('storage')"><span>02</span>存储管理</button><button onclick="beginImport('nas')"><span>03</span>目录多选</button><button onclick="demoReview()"><span>04</span>命名与导入</button></nav><div class="hint">静态交互稿 · 全部为演示数据<br>不会连接实际存储或修改应用数据。<p>可尝试：导入 → 家庭 NAS → 多选目录 → 下一步 → 命名导入。长按文件源可管理。</p><button class="secondary" onclick="toggleTheme()">切换深色 / 浅色</button></div></aside><main class="phone" id="phone"><div class="island"></div><div class="status"><span>9:41</span><span>5G <svg viewBox="0 0 24 24"><path d="M3 9a14 14 0 0 1 18 0M6 13a9 9 0 0 1 12 0M9 17a4 4 0 0 1 6 0"/></svg>▰</span></div><div id="app" class="screen"></div><div id="modal"></div><div id="toast"></div></main><aside class="aside"><div class="block"><b>一套清楚的关系</b><br>存储 → 文件源 → 聚合媒体库<br>同一存储可以导入多个目录。</div><div class="block"><b>独立控制入库范围</b><br>文件源可单独禁用、扫描、命名和移除。关闭开关仍能浏览存储。</div><div class="block"><b>保持原生交互</b><br>导航推进、目录多选、底部操作区。玻璃用于浮动操作，不叠加到每一行。</div></aside></div>
<script>
const paths={back:'M15 5 8 12l7 7',plus:'M12 5v14M5 12h14',folder:'M3 7h7l2 2h9v11H3z M3 7V4h7l2 3',disk:'M4 5h16v14H4z M4 14h16 M16 17h1',cloud:'M6 18a5 5 0 0 1-1-10 7 7 0 0 1 13-1 5.5 5.5 0 0 1 0 11H6',network:'M12 4v6M4 19v-5h16v5M12 14v5 M8 3h8v6H8z',check:'M5 12l4 4L19 6',chevron:'m9 5 7 7-7 7',close:'m6 6 12 12M18 6 6 18',refresh:'M20 8a8 8 0 1 0 0 8 M20 3v6h-6',search:'M16 16l5 5 M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',home:'m3 11 9-8 9 8M5 10v11h14V10M10 21v-7h4v7',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2',dots:'M5 12h.01M12 12h.01M19 12h.01',edit:'m4 16 12-12 4 4-12 12-5 1z',trash:'M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7',play:'m8 4 13 8-13 8z'};
const icon=(name,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.folder}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stores=[{id:'nas',name:'家庭 NAS',type:'SMB · Media 共享',detail:'192.168.1.8 · jiangyi',icon:'disk',group:'网络共享',ok:true},{id:'web',name:'远程影音',type:'WebDAV',detail:'nas.example.com / media',icon:'network',group:'网络共享',ok:true},{id:'local',name:'我的影片',type:'本地文件夹',detail:'文件 App · 已授权目录',icon:'folder',group:'本地',ok:true},{id:'pan',name:'115 个人网盘',type:'115 网盘',detail:'个人账户',icon:'cloud',group:'网盘',ok:false},{id:'dlna',name:'客厅媒体中心',type:'DLNA',detail:'局域网设备',icon:'network',group:'局域网设备',ok:true}];
let sources=[{id:'s1',store:'nas',path:'/电影/华语',name:'华语电影',enabled:true,meta:'286 个视频 · 18 分钟前更新'},{id:'s2',store:'nas',path:'/电视剧',name:'我的剧集',enabled:true,meta:'1,240 个视频 · 今天 08:30 更新'},{id:'s3',store:'web',path:'/动漫',name:'动漫剧场',enabled:false,meta:'已禁用 · 内容保留，可随时恢复'}];
const tree={'/':[{name:'电影',count:'6 个文件夹'},{name:'电视剧',count:'42 个文件夹'},{name:'纪录片',count:'18 个文件夹'},{name:'动漫',count:'26 个文件夹'}],'/电影':[{name:'华语',count:'286 个视频'},{name:'外语',count:'492 个视频'},{name:'动画电影',count:'126 个视频'}],'/纪录片':[{name:'自然',count:'84 个视频'},{name:'人文',count:'62 个视频'},{name:'历史',count:'31 个视频'}],'/动漫':[{name:'国漫',count:'16 个文件夹'},{name:'日漫',count:'10 个文件夹'}]};
let page='library',storeID='nas',directory='/',selected=new Map(),names={},immediate=true,light=false,outer='aggregate';
function storage(id){return stores.find(s=>s.id===id)}
function toast(text){document.getElementById('toast').innerHTML=`<div role="status" class="toast">${esc(text)}</div>`;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>document.getElementById('toast').innerHTML='',3200)}
function nav(title,back,action){return `<header class="nav ${back?'small':''}">${back?`<button class="round" aria-label="返回" onclick="${back}">${icon('back')}</button>`:''}<h2>${esc(title)}</h2>${action||'<span class="spacer"></span>'}</header>`}
function go(value){closeSheet();page=value;render()}
function dock(){return `<footer class="dock"><div class="dockmain"><button onclick="toast('聚合内容将在首页展示，当前为片源设计预览')">${icon('home')}首页</button><button class="on" onclick="go('library')">${icon('disk')}片源</button><button onclick="toast('扫描和匹配的全局配置位于设置 → 聚合媒体库')">${icon('settings')}设置</button></div><button class="search" aria-label="搜索" onclick="toast('保留全局影片搜索入口；本稿演示片源管理')">${icon('search')}</button></footer>`}
function render(){document.querySelectorAll('.steps button').forEach((b,i)=>b.classList.toggle('active',(['library','storage','browse','review'][i])===page));document.getElementById('app').innerHTML=page==='library'?libraryPage():page==='storage'?storagePage():page==='browse'?browsePage():reviewPage()}
function libraryPage(){return nav('片源','',`<button class="round" aria-label="添加片源" onclick="addMenu()">${icon('plus')}</button>`)+`<div class="scroll"><div class="seg"><button onclick="outer='servers';render()" class="${outer==='servers'?'on':''}">影视服务器</button><button onclick="outer='aggregate';render()" class="${outer==='aggregate'?'on':''}">聚合媒体库</button></div>${outer==='servers'?`<div class="empty">影视服务器使用各自的元数据和观看记录。<br><button class="secondary" onclick="outer='aggregate';render()">查看聚合媒体库设计</button></div>`:`<section class="metrics" aria-label="聚合统计"><div class="metricrow"><div class="metric"><b>1,286</b><small>电影 · 部</small></div><div class="metric"><b>86</b><small>剧集 · 部</small></div><div class="metric"><b>3,694</b><small>视频文件</small></div></div><div class="update">${icon('refresh')}<span>18 分钟前更新</span><span>${sources.filter(s=>s.enabled).length} 个文件源已启用</span></div></section><button class="storage-entry" onclick="go('storage')"><span class="tile cool">${icon('disk')}</span><span class="entry-text"><strong>存储 <span style="color:#8b97a7;font-size:13px;margin-left:5px">${stores.length}</span></strong><span class="sub">本地、网络共享与网盘</span></span>${stores.some(s=>!s.ok)?`<span class="pill warn">${stores.filter(s=>!s.ok).length} 项需授权</span>`:''}${icon('chevron','chevron')}</button><div class="sectionhead"><h3>文件源<small>${sources.length}</small></h3><button class="action" onclick="chooseStorage()">${icon('plus')}导入</button></div><div class="group">${sources.map(sourceRow).join('')||'<div class="empty">从存储中选择目录，建立第一个文件源。</div>'}</div><div class="footnote">长按文件源可重新扫描、重命名或移除。<br>只有启用的文件源会参与聚合入库。</div>`}</div>`+dock()}
function sourceRow(s){const st=storage(s.store);return `<div class="source ${s.enabled?'':'off'}" role="button" tabindex="0" aria-label="${esc(s.name)}，长按管理" oncontextmenu="event.preventDefault();sourceActions('${s.id}')" onpointerdown="hold(event,'${s.id}')" onpointerup="clearTimeout(window.holdTimer)" onpointerleave="clearTimeout(window.holdTimer)" onclick="sourceOpen('${s.id}')" onkeydown="if(event.key==='Enter')sourceActions('${s.id}')"><span class="tile warm">${icon('folder')}</span><span class="entry-text"><strong>${esc(s.name)}</strong><div class="path">${esc(st.name)} · ${esc(s.path)}</div><div class="meta">${s.enabled?'<i class="dot"></i>':''}${esc(s.meta)}</div></span><button class="toggle ${s.enabled?'on':''}" role="switch" aria-checked="${s.enabled}" aria-label="${esc(s.name)}加入聚合媒体库" onpointerdown="event.stopPropagation()" onclick="event.stopPropagation();toggleSource('${s.id}')"></button></div>`}
function hold(e,id){if(e.target.closest('button'))return;window.held=false;window.holdTimer=setTimeout(()=>{window.held=true;sourceActions(id)},550)}
function sourceOpen(id){if(window.held){window.held=false;return}const s=sources.find(s=>s.id===id);storeID=s.store;directory=s.path;selected.clear();go('browse')}
function toggleSource(id){const s=sources.find(s=>s.id===id);s.enabled=!s.enabled;s.meta=s.enabled?'等待扫描 · 将重新加入聚合媒体库':'已禁用 · 内容保留，可随时恢复';render()}
function storagePage(){const groups=['本地','网络共享','网盘','局域网设备'];return nav('存储',"go('library')",`<button class="round" aria-label="添加存储" onclick="addStorage()">${icon('plus')}</button>`)+`<div class="scroll"><p class="note">管理访问连接，再从存储中选择需要入库的目录。</p>${groups.filter(g=>stores.some(s=>s.group===g)).map(g=>`<div class="label">${g}</div><div class="group">${stores.filter(s=>s.group===g).map(s=>`<div class="store" role="button" tabindex="0" oncontextmenu="event.preventDefault();storeActions('${s.id}')" onpointerdown="holdStore(event,'${s.id}')" onpointerup="clearTimeout(window.holdTimer)" onpointerleave="clearTimeout(window.holdTimer)" onclick="if(!window.held)openStore('${s.id}');window.held=false" onkeydown="if(event.key==='Enter')openStore('${s.id}')"><span class="tile ${s.group==='网盘'?'cool':''}">${icon(s.icon)}</span><span class="entry-text"><strong>${esc(s.name)}</strong><div class="sub">${esc(s.type)}</div><div class="meta">${sources.filter(f=>f.store===s.id).length} 个文件源 · ${s.ok?'可访问':'需要重新授权'}</div></span>${!s.ok?'<span class="pill warn">需授权</span>':icon('chevron','chevron')}</div>`).join('')}</div>`).join('')}<p class="footnote">添加存储不会自动扫描全部内容。移除文件源也不会断开这里的连接。</p></div>`}
function openStore(id){storeID=id;if(!storage(id).ok){sheet('需要重新授权',`<p class="note">${esc(storage(id).name)}的授权已失效，已有文件源与媒体索引会保留。</p><button class="primary" onclick="storage('${id}').ok=true;closeSheet();render();toast('授权修复交互示意，未连接真实网盘')">重新授权</button>`);return}beginImport(id)}
function beginImport(id){storeID=id;directory='/';selected.clear();names={};go('browse')}
function blocked(path){return sources.find(s=>s.store===storeID&&(s.path===path||s.path==='/'||path.startsWith(s.path+'/')||s.path.startsWith(path==='/'?'/':path+'/')))}
function covered(path){return [...selected.keys()].some(p=>p!==path&&(p==='/'||path.startsWith(p+'/')))}
function toggleDirectory(path){if(blocked(path)){toast('与已有文件源范围重叠，请先管理现有文件源');return}if(selected.has(path)){selected.delete(path);render();return}if(covered(path)){toast('已包含在选中的父目录中');return}let replaced=false;for(const p of selected.keys()){if(path==='/'||p.startsWith(path+'/')){selected.delete(p);replaced=true}}selected.set(path,true);if(replaced)toast('已用父目录替换选中的下级目录');render()}
function folderPath(name){return (directory==='/'?'':directory)+'/'+name}
function browsePage(){const st=storage(storeID);const parts=directory.split('/').filter(Boolean);const rows=tree[directory]||[];return nav('选择目录',"go('storage')",`<button class="secondary" onclick="selectionSheet()">已选 ${selected.size}</button>`)+`<div class="scroll"><div class="crumbs"><button onclick="directory='/';render()">${esc(st.name)}</button>${parts.map((p,i)=>`${icon('chevron')}<button onclick="directory='/${esc(parts.slice(0,i+1).join('/'))}';render()">${esc(p)}</button>`).join('')}</div><p class="note">点击选择框选中目录，点击目录名称进入下一级。可跨层多选。</p>${rows.length?rows.map(f=>{const path=folderPath(f.name),existing=blocked(path),isCovered=covered(path),isSelected=selected.has(path);return `<div class="folderrow"><button class="check ${isSelected?'selected':''}" aria-label="选择${esc(f.name)}" aria-pressed="${isSelected}" onclick="toggleDirectory('${path}')" ${existing||isCovered?'disabled':''}>${isSelected?icon('check'):''}</button><span class="tile">${icon('folder')}</span><button class="foldertitle" onclick="directory='${path}';render()"><strong>${esc(f.name)}</strong><div class="sub">${existing?'与「'+esc(existing.name)+'」范围重叠':isCovered?'已包含在所选父目录':esc(f.count)}</div></button>${icon('chevron','chevron')}</div>`}).join(''):`<div class="folderrow"><span class="tile">${icon('play')}</span><span class="entry-text"><strong>示例影片.mkv</strong><div class="sub">视频文件 · 不能作为目录选择</div></span></div><p class="footnote">可使用底部“选择当前目录”导入此范围。</p>`}<button class="secondary" onclick="toggleDirectory('${directory}')">${selected.has(directory)?'取消选择当前目录':'选择当前目录'}</button></div><div class="tray"><div class="trayline"><button onclick="selectionSheet()">已选 ${selected.size} 个目录</button><span class="muted">${esc(st.name)}</span></div><button class="primary" ${selected.size?'':'disabled'} onclick="review()">下一步</button></div>`}
function review(){if(!selected.size)return;for(const p of selected.keys()){if(!names[p])names[p]=p==='/'?storage(storeID).name+' · 全部视频':p.split('/').pop()}go('review')}
function demoReview(){storeID='nas';selected=new Map([['/电影/外语',true],['/纪录片/自然',true]]);names={};review()}
function reviewPage(){return nav('导入文件源',"go('browse')")+`<div class="scroll"><p class="note">为每个目录命名。之后可以分别扫描、禁用或移除。</p>${[...selected.keys()].map((p,i)=>`<section class="naming"><div class="naminghead">${icon(storage(storeID).icon)}${esc(storage(storeID).name)}<button aria-label="移除此目录" onclick="removeSelection('${p}')">${icon('close')}</button></div><input aria-label="文件源${i+1}名称" value="${esc(names[p]||'')}" oninput="names['${p}']=this.value;validateNames()"><div class="path">${esc(p)}</div></section>`).join('')}<div class="settingrow"><span class="entry-text"><strong>导入后立即扫描</strong><div class="sub">扫描视频并在本机匹配海报和资料</div></span><button class="toggle ${immediate?'on':''}" role="switch" aria-checked="${immediate}" aria-label="导入后立即扫描" onclick="immediate=!immediate;render()"></button></div><p class="footnote">只管理选中的目录范围。名称仅用于 Lucent，不会改动存储中的文件夹。</p></div><div class="tray"><button id="importButton" class="primary" onclick="importSources()">导入 ${selected.size} 个文件源</button></div>`}
function validateNames(){const b=document.getElementById('importButton');if(b)b.disabled=![...selected.keys()].every(p=>(names[p]||'').trim())}
function removeSelection(p){selected.delete(p);if(!selected.size){go('browse');return}render();validateNames()}
function importSources(){if(!selected.size||![...selected.keys()].every(p=>(names[p]||'').trim()))return;let count=0;for(const p of selected.keys()){if(blocked(p))continue;sources.push({id:'s'+Date.now()+(count++),store:storeID,path:p,name:names[p].trim(),enabled:true,meta:immediate?'等待扫描 · 已加入任务队列':'尚未扫描'});}selected.clear();outer='aggregate';go('library');toast(`已导入 ${count} 个文件源（演示）。${immediate?'将按目录排队扫描':'可稍后扫描'}`)}
function sheet(title,body){document.getElementById('modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeSheet()"><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="handle"></div><div class="sheethead"><h3>${esc(title)}</h3><button class="round" aria-label="关闭" onclick="closeSheet()">${icon('close')}</button></div>${body}</section></div>`}
function closeSheet(){document.getElementById('modal').innerHTML=''}
function chooseStorage(){sheet('从存储导入',stores.map(s=>`<button class="choice" onclick="closeSheet();openStore('${s.id}')"><span class="tile">${icon(s.icon)}</span><span class="entry-text"><strong>${esc(s.name)}</strong><span class="sub">${esc(s.type)}${s.ok?'':' · 需要授权'}</span></span>${icon('chevron','chevron')}</button>`).join('')+`<button class="choice" onclick="addStorage()">${icon('plus')}添加存储</button>`)}
function addMenu(){sheet('添加到片源',`<button class="choice" onclick="chooseStorage()">${icon('folder')}从存储导入文件源</button><button class="choice" onclick="addStorage()">${icon('disk')}添加存储</button><button class="choice" onclick="closeSheet();outer='servers';go('library')">${icon('network')}连接影视服务器</button>`)}
function addStorage(){sheet('添加存储',[['folder','本地文件夹','通过系统目录选择器授予访问权限'],['disk','SMB 共享','连接 NAS 或电脑中的共享根'],['network','WebDAV','连接指定账户和根目录'],['cloud','网盘','115、123 及其他支持的服务'],['network','DLNA','发现局域网媒体设备']].map(([ic,title,detail])=>`<button class="choice" onclick="connectionPreview('${title}')"><span class="tile">${icon(ic)}</span><span class="entry-text"><strong>${title}</strong><span class="sub">${detail}</span></span>${icon('chevron','chevron')}</button>`).join(''))}
function connectionPreview(type){sheet('添加'+type,`<p class="note">此处衔接现有${type==='本地文件夹'?'系统文件夹授权':'连接 / 授权'}流程。成功后保存存储，再选择需要入库的目录。</p><button class="primary" onclick="closeSheet();go('storage');toast('已展示授权成功后的存储列表，未发起真实连接')">查看连接后的存储列表</button>`)}
function holdStore(e,id){window.held=false;window.holdTimer=setTimeout(()=>{window.held=true;storeActions(id)},550)}
function storeActions(id){const s=storage(id),count=sources.filter(f=>f.store===id).length;sheet(s.name,`<p class="note">${esc(s.type)} · ${esc(s.detail)}<br>被 ${count} 个文件源使用。</p><button class="choice" onclick="editStorage('${id}')">${icon('edit')}编辑存储</button><button class="choice" onclick="storage('${id}').ok=true;closeSheet();render();toast('重新验证连接的交互示意')">${icon('refresh')}重新连接 / 授权</button><button class="choice danger" onclick="removeStorageDialog('${id}')">${icon('trash')}移除存储</button>`)}
function editStorage(id){const s=storage(id);sheet('编辑存储',`<p class="note">存储名称</p><input id="storageName" aria-label="存储名称" value="${esc(s.name)}"><p class="note">${esc(s.type)}<br>${esc(s.detail)}<br>连接凭据沿用该类型的授权表单；更换账户将新建存储身份。</p><button class="primary" onclick="saveStorageName('${id}')">保存名称</button>`)}
function saveStorageName(id){const name=document.getElementById('storageName').value.trim();if(!name)return;storage(id).name=name;closeSheet();render()}
function removeStorageDialog(id){const s=storage(id),count=sources.filter(f=>f.store===id).length;sheet('移除存储？',`<p class="note">移除「${esc(s.name)}」及其 ${count} 个文件源？<br>关联内容会退出聚合媒体库，原始文件不会删除。</p><button class="primary" onclick="removeStorage('${id}')">移除存储及关联文件源</button>`)}
function removeStorage(id){sources=sources.filter(s=>s.store!==id);stores.splice(stores.findIndex(s=>s.id===id),1);closeSheet();render();toast('已移除演示存储及关联文件源')}
function sourceActions(id){const s=sources.find(s=>s.id===id);sheet(s.name,`<p class="note">${esc(storage(s.store).name)} · ${esc(s.path)}</p><button class="choice" ${s.enabled?'':'disabled'} onclick="scanSource('${id}')">${icon('refresh')}重新扫描</button><button class="choice" onclick="toggleSource('${id}');closeSheet()">${icon('check')}${s.enabled?'禁用文件源':'启用文件源'}</button><button class="choice" onclick="renameSource('${id}')">${icon('edit')}重命名</button><button class="choice" onclick="closeSheet();go('storage')">${icon('disk')}查看存储</button><button class="choice danger" onclick="confirmRemove('${id}')">${icon('trash')}移除文件源</button>`)}
function scanSource(id){sources.find(s=>s.id===id).meta='等待扫描 · 已加入任务队列';closeSheet();render();toast('单独扫描此文件源，演示稿不发起实际任务')}
function renameSource(id){const s=sources.find(s=>s.id===id);sheet('重命名文件源',`<input id="renameInput" aria-label="文件源名称" value="${esc(s.name)}"><button class="primary" onclick="saveRename('${id}')">保存</button><p class="footnote">不会修改存储目录名，也不会改变观看进度。</p>`)}
function saveRename(id){const name=document.getElementById('renameInput').value.trim();if(!name)return;sources.find(s=>s.id===id).name=name;closeSheet();render()}
function confirmRemove(id){const s=sources.find(s=>s.id===id);sheet('移除文件源？',`<p class="note">从聚合媒体库移除「${esc(s.name)}」？<br>存储连接和原始文件会保留。</p><button class="primary" onclick="sources=sources.filter(s=>s.id!=='${id}');closeSheet();render();toast('文件源已移除，存储连接仍保留')">确认移除</button>`)}
function selectionSheet(){sheet('已选目录',selected.size?[...selected.keys()].map(p=>`<button class="choice" onclick="selected.delete('${p}');closeSheet();render()"><span class="entry-text"><strong>${esc(p==='/'?'存储根':p.split('/').pop())}</strong><span class="sub">${esc(p)}</span></span>${icon('close')}</button>`).join(''):'<p class="note">还没有选择目录。</p>')}
function toggleTheme(){light=!light;document.getElementById('phone').classList.toggle('light',light)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});render();
</script></body></html>
