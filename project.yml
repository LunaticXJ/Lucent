name: Lucent
options:
  developmentLanguage: zh-Hans
  bundleIdPrefix: com.lucent
  deploymentTarget:
    iOS: '18.0'
    tvOS: '18.0'
    macOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    CURRENT_PROJECT_VERSION: '6065'
packages:
  SwiftSMB:
    url: https://github.com/RuiNelson/SwiftSMB.git
    exactVersion: 3.3.1
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    revision: d9194243bdc68b87d8989376ab52aee7da6c8e0b
  LucentAether:
    path: Packages/LucentAether
targets:
  Lucent-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/LucentApp
        excludes: [Resources/SubtitleFonts]
      - path: Sources/LucentApp/Resources/SubtitleFonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: SwiftSMB
        products: [SwiftSMB]
      - package: MPVKit
        products: [MPVKit]
      - package: LucentAether
        products: [LucentAether]
        embed: true
      - sdk: libsqlite3.tbd
    info:
      path: Generated/iOS-Info.plist
      properties:
        CFBundleDisplayName: Lucent
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AppBackground
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Lucent 需要访问你添加的局域网媒体片源。
        NSBonjourServices: [_smb._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Generated/iOS.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.lucent.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucent.app.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1,2'
  Lucent-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: Sources/LucentApp
        excludes: [Resources/SubtitleFonts]
      - path: Sources/LucentApp/Resources/SubtitleFonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: SwiftSMB
        products: [SwiftSMB]
      - package: MPVKit
        products: [MPVKit]
      - package: LucentAether
        products: [LucentAether]
        embed: true
      - sdk: libsqlite3.tbd
    info:
      path: Generated/tvOS-Info.plist
      properties:
        CFBundleDisplayName: Lucent
        UIBackgroundModes: [audio]
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: Lucent 需要访问你添加的局域网媒体片源。
        NSBonjourServices: [_smb._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Generated/tvOS.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.lucent.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucent.app.tvos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconTV
  Lucent-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/LucentApp
        excludes: [Resources/SubtitleFonts]
      - path: Sources/LucentApp/Resources/SubtitleFonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: SwiftSMB
        products: [SwiftSMB]
      - package: MPVKit
        products: [MPVKit]
      - package: LucentAether
        products: [LucentAether]
        embed: true
      - sdk: libsqlite3.tbd
    info:
      path: Generated/macOS-Info.plist
      properties:
        CFBundleDisplayName: Lucent
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBonjourServices: [_smb._tcp]
        NSLocalNetworkUsageDescription: Lucent 需要发现和访问你添加的局域网媒体片源。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Generated/macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.lucent.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucent.app.macos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_USER_SELECTED_FILES: readonly
schemes:
  Lucent-iOS:
    build:
      targets:
        Lucent-iOS: all
  Lucent-tvOS:
    build:
      targets:
        Lucent-tvOS: all
  Lucent-macOS:
    build:
      targets:
        Lucent-macOS: all
